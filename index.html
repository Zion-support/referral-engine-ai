<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Referral Engine AI</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:110px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🤝 Referral Engine AI</h1><p>Model referral program ROI.</p><label>Customers: <input id="c" type="number" value="1000"></label> <label>Avg deal ($): <input id="d" type="number" value="500"></label> <label>Referral reward ($): <input id="r" type="number" value="50"></label> <button onclick="go()">Simulate</button><div id="out"></div><script>function go(){const c=+document.getElementById('c').value,d=+document.getElementById('d').value,r=+document.getElementById('r').value;const refs=Math.round(c*0.08),conv=Math.round(refs*0.3),rev=conv*d,cost=refs*r;document.getElementById('out').textContent=`Expected referrals/mo: ${refs}\nConversions (30%): ${conv}\nRevenue: $${rev.toLocaleString()}\nReward cost: $${cost.toLocaleString()}\nROI: ${cost?Math.round((rev-cost)/cost*100):0}%\nAdvocate detection & fraud filters raise conversion ~2x in production: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/referral-engine-ai">GitHub</a> · <a href="https://ziontechgroup.com/newsletter-growth-copilot/">Newsletter Copilot</a></p></body></html>
